<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · AL的助手</title><style>
:root{--blue:#275ddb;--ink:#243247;--muted:#657485;--line:#dce3eb;--paper:#fff;--bg:#f6f8fb}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:6px 13px;cursor:pointer}button:hover{border-color:#799ce9;background:#f6f9ff}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#1e4fbf}.danger{color:#a03936}button:focus-visible,a:focus-visible,input:focus,textarea:focus,select:focus{outline:3px solid #a7bff5;outline-offset:2px}a{color:var(--blue)}header{background:#fff;border-bottom:1px solid var(--line);padding:15px clamp(16px,4vw,58px);display:flex;align-items:center;gap:12px}.brand{font-size:20px;font-weight:700}.mark{display:grid;place-items:center;color:white;background:var(--blue);width:37px;height:37px;border-radius:10px;font-size:16px;font-weight:800}.spacer{flex:1}header a{font-size:14px;text-decoration:none}.frame{max-width:1480px;margin:auto;display:grid;grid-template-columns:215px minmax(0,1fr);gap:32px;padding:32px clamp(16px,4vw,58px)}nav{display:flex;flex-direction:column;gap:4px;align-self:start;position:sticky;top:18px}nav button{text-align:left;border:0;background:transparent;border-radius:7px;padding:10px 16px}nav button.active{color:var(--blue);background:#e7efff;font-weight:700}main{min-width:0}.panel,dialog{background:white;border:1px solid var(--line);border-radius:12px;padding:clamp(16px,2.4vw,30px);margin:0 0 16px}.panel h2:first-child,.panel h3:first-child{margin-top:0}h1,h2,h3{line-height:1.4}h1{font-size:30px;margin:0}h2{font-size:21px}h3{font-size:17px}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.bar h1,.bar h2{margin:0}.muted,small{color:var(--muted)}.muted{font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}.grid>.wide{grid-column:1/-1}label{display:block;font-weight:600;font-size:14px}input:not([type=checkbox]),textarea,select{width:100%;min-width:0;border:1px solid #cbd5df;border-radius:7px;background:#fff;padding:8px 10px;color:var(--ink);margin-top:4px}textarea{resize:vertical;min-height:85px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--line)}.row>div:first-child{flex:1;min-width:min(100%,170px);overflow-wrap:anywhere}.row p{margin:2px 0}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.actions button{font-size:14px}.pill{background:#edf2fa;border-radius:5px;font-size:12px;padding:3px 7px}.block{border:1px solid var(--line);background:#fafcfe;border-radius:9px;padding:15px;margin:10px 0}.block .bar{margin-bottom:6px}.block label{margin-top:8px}.thumb{max-height:120px;max-width:100%;border-radius:5px;display:block;margin:12px 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.metrics button{text-align:left;padding:18px}.metrics b{display:block;color:var(--blue);font-size:30px}.login{max-width:430px;margin:10vh auto}.login label{margin:17px 0}.login button{width:100%}#notice{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;background:#243247;color:#fff;padding:9px 18px;border-radius:7px;max-width:90vw}dialog{width:min(780px,94vw);max-height:85vh;overflow:auto;margin:auto}dialog::backdrop{background:#16243c80}dialog img{max-width:100%}.sticky{position:sticky;bottom:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px;z-index:1}.empty{color:var(--muted);padding:12px 0}.editor-tools{display:flex;gap:8px;align-items:end}.editor-tools select{width:auto}.note{background:#fff6d9;padding:12px 16px;border-radius:8px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.gallery figure{margin:0;border:1px solid var(--line);padding:10px;border-radius:8px;overflow-wrap:anywhere}.gallery img{width:100%;height:110px;object-fit:contain;background:var(--bg)}[hidden]{display:none!important}@media(max-width:760px){body{font-size:17px}header{padding:12px 16px}.frame{display:block;padding:10px 14px 22px}nav{position:static;flex-direction:row;overflow:auto;padding:4px 0 10px;margin-bottom:10px}nav button{white-space:nowrap}.grid{grid-template-columns:1fr}.metrics{gap:5px}.metrics button{font-size:13px;padding:10px}.bar{gap:7px}h1{font-size:25px}.login{margin:7vh 16px}.sticky{bottom:2px}.panel{padding:15px}.brand{font-size:17px}}
</style></head><body><header><span class="mark">AL</span><span class="brand">AL的助手 · 管理后台</span><span class="spacer"></span><a href="/">查看网站 ↗</a></header><div id="shell"></div><div id="notice" hidden role="status"></div><dialog id="modal"><div class="bar"><h2 id="mt"></h2><span class="spacer"></span><button onclick="modal.close()">关闭</button></div><div id="mc"></div></dialog><script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), main=()=>$('#workspace');
let state,section='概览',noticeTimer,editing=null,filter='',search='',timer,saveChain=Promise.resolve(),revision=0;
const pages=['概览','教程管理','分类与标签','新手学习路线','图片管理','访客反馈','网站设置'];
const btn=(label,action,id='',cls='')=>'<button type="button" class="'+cls+'" data-action="'+action+'" data-id="'+esc(id)+'">'+esc(label)+'</button>';
const field=(label,key,value='',type='text',wide=false)=>'<label class="'+(wide?'wide':'')+'">'+esc(label)+(type==='textarea'?'<textarea data-key="'+key+'">'+esc(value)+'</textarea>':'<input data-key="'+key+'" type="'+type+'" value="'+esc(value)+'">')+'</label>';
const select=(label,key,val,options)=>'<label>'+esc(label)+'<select data-key="'+key+'">'+options.map(([v,l])=>'<option value="'+esc(v)+'" '+(String(v)===String(val)?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select></label>';
const val=(key,root=document)=>root.querySelector('[data-key="'+key+'"]')?.value??'';
function toast(msg){clearTimeout(noticeTimer);$('#notice').textContent=msg;$('#notice').hidden=false;noticeTimer=setTimeout(()=>$('#notice').hidden=true,3500)}
function popup(title,html){$('#mt').textContent=title;$('#mc').innerHTML=html;if(!$('#modal').open)$('#modal').showModal()}
async function api(path,body,method=body===undefined?'GET':'POST'){const res=await fetch('/api/'+path,{method,headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await res.json().catch(()=>({}));if(!res.ok){const err=new Error(data.error||'请求失败，请重试');err.status=res.status;throw err}return data}
function login(){state=null;$('#shell').innerHTML='<form class="panel login" id="login"><h1>管理员登录</h1><label>管理密码<input type="password" id="pass" autocomplete="current-password" required autofocus></label><button class="primary">登录后台</button><p role="alert" id="loginerror" class="danger"></p></form>';$('#login').onsubmit=async e=>{e.preventDefault();try{await api("login",{password:$('#pass').value});await start()}catch(e){$('#loginerror').textContent=e.message}}}
function frame(){const shell=$('#shell');shell.innerHTML='<div class="frame"><nav aria-label="后台导航">'+pages.map(p=>btn(p,'nav',p,p===section?'active':'')).join('')+btn('退出登录','logout')+'</nav><main id="workspace"></main></div>';draw()}
const heading=(name,right='')=>'<div class="bar"><h1>'+esc(name)+'</h1><span class="spacer"></span>'+right+'</div>';
const empty=msg=>'<p class="empty">'+esc(msg)+'</p>';


async function refresh(){state=await api('admin')}
async function start(){try{await refresh();frame()}catch(e){if(e.status===401||e.status===403)login();else{$('#shell').textContent=e.message}}}
const article=id=>state.articles.find(a=>a.id===id);
const title=a=>(a?.draft||a?.published)?.title||'未命名教程';
const category=id=>state.categories.find(c=>c.id===id)?.name||'未分类';
const types={text:'普通文字',heading:'标题',image:'图片',video:'教学视频',step:'操作步骤',checklist:'准备清单',note:'注意事项',success:'成功提示',faq:'常见问题',related:'相关教程链接'};
const stat=a=>a.trashed?'回收站':a.archived?'已归档':a.published?'已发布':'草稿';
const articles=()=>state.articles.filter(a=>!a.trashed);
function draw(){const m=main();if(editing){editor();return}if(section==='概览'){m.innerHTML=heading('概览')+'<div class="metrics">'+[['已发布教程',articles().filter(a=>a.published&&!a.archived).length,'教程管理'],['草稿',articles().filter(a=>!a.published).length,'教程管理'],['访客反馈',state.feedback.length,'访客反馈']].map(([l,n,p])=>'<button data-action="nav" data-id="'+p+'"><b>'+n+'</b>'+l+'</button>').join('')+'</div><section class="panel"><div class="bar"><h2>教程</h2><span class="spacer"></span>'+btn('＋ 新建教程','new','','primary')+'</div>'+rows(articles().slice(0,5))+'</section>';return}
if(section==='教程管理'){m.innerHTML=heading('教程管理',btn('模板库','templates')+btn('一键导入 HTML','importHTML')+btn('＋ 新建教程','new','','primary'))+'<section class="panel"><div class="bar">'+['全部','草稿','已发布','已归档','回收站'].map(k=>btn(k,'filter',k,(filter||'全部')===k?'primary':'')).join('')+'</div><label>查找教程<input id="findArticle" type="search" value="'+esc(search)+'" placeholder="输入教程标题"></label><div id="articleRows"></div></section>';listRows();$('#findArticle').oninput=e=>{search=e.target.value;listRows()};return}
if(section==='分类与标签'){m.innerHTML=heading(section,btn('＋ 新增分类','categoryAdd','','primary'))+'<div class="panel" id="categories">'+state.categories.slice().sort((a,b)=>a.order-b.order).map(c=>categoryRow(c)).join('')+'</div><div class="panel"><h2>教程标签</h2><p class="muted">在教程编辑器中添加或修改标签。</p>'+[...new Set(articles().flatMap(a=>(a.draft||a.published)?.tags||[]))].map(t=>'<span class="pill">'+esc(t)+'</span> ').join('')+'</div>'+btn('保存分类','categorySave','','primary');return}
if(section==='新手学习路线'){m.innerHTML=heading(section,btn('＋ 新增环节','routeAdd','','primary'))+'<div id="routeRows">'+state.route.map(routeRow).join('')+'</div>'+btn('保存学习路线','routeSave','','primary');return}
if(section==='图片管理'){m.innerHTML=heading(section,btn('上传图片','upload','','primary'))+'<div class="panel"><p class="note">上传前请遮盖截图中的手机号、账号和其他个人信息。</p><div class="gallery">'+(state.media.filter(i=>!i.mime?.startsWith('video/')).map(i=>'<figure><img loading="lazy" src="'+esc(i.url)+'" alt="'+esc(i.name)+'"><figcaption>'+esc(i.name)+'</figcaption>'+btn('复制图片地址','copy',i.url)+'</figure>').join('')||empty('还没有上传图片。'))+'</div></div>';return}
if(section==='访客反馈'){m.innerHTML=heading(section)+'<div class="panel">'+(state.feedback.map(f=>'<div class="row"><div><b>'+esc(f.type)+'</b><p>'+esc(f.text)+'</p><small>'+esc(f.at)+' · '+esc(f.articleId?title(article(f.articleId)):'全站反馈')+'</small></div>'+(article(f.articleId)?btn('查看教程','edit',f.articleId):'')+'</div>').join('')||empty('还没有收到访客反馈。'))+'</div>';return}
settingsForm()}
function rows(items){return items.map(a=>'<div class="row"><div><b>'+esc(title(a))+'</b><p class="muted">'+esc(category((a.draft||a.published)?.category))+' · '+stat(a)+'</p></div><div class="actions">'+(a.trashed?btn('恢复教程','restore',a.id):btn('编辑','edit',a.id)+(a.archived?btn('恢复上线','restore',a.id):a.published?btn('归档','archive',a.id):'')+btn('移入回收站','trash',a.id,'danger'))+'</div></div>').join('')||empty('这里还没有教程。')}
function listRows(){$('#articleRows').innerHTML=rows(state.articles.filter(a=>((filter||'全部')==='全部'?!a.trashed:stat(a)===filter)&&title(a).toLowerCase().includes(search.trim().toLowerCase())))}
function categoryRow(c){return '<div class="block cat" data-id="'+esc(c.id)+'"><div class="grid">'+field('分类名称','name',c.name)+field('排序（数字小的在前）','order',c.order,'number')+'</div><label><input type="checkbox" data-key="hidden" '+(c.hidden?'checked':'')+'> 隐藏此分类</label></div>'}
function articleOptions(){return [['','请选择'],...articles().map(a=>[a.id,title(a)])]}
function routeRow(r){return '<div class="block route"><div class="bar"><b>学习环节</b><span class="spacer"></span>'+btn('上移','up')+btn('下移','down')+btn('移除','remove')+'</div><div class="grid">'+field('环节名称','title',r.title)+select('关联教程','articleId',r.articleId,articleOptions())+field('说明','description',r.description,'text',true)+'</div></div>'}
function featuredRows(){
 const selected=state.settings.featured||[];
 const all=articles().filter(a=>a.published&&!a.archived).sort((a,b)=>{
   const rank=id=>selected.includes(id)?selected.indexOf(id):999;
   return rank(a.id)-rank(b.id);
 });
 return '<details><summary>选择并排列首页推荐教程（最多 6 篇）</summary><p class="muted">勾选后可拖动，也可以用上下箭头调整顺序。空位按推荐顺序补齐。</p><div id="featuredList">'+all.map(a=>'<div class="row" draggable="true"><label><input type="checkbox" data-feature="'+esc(a.id)+'" '+(selected.includes(a.id)?'checked':'')+'> '+esc(title(a))+'</label>'+btn('↑','featureUp')+btn('↓','featureDown')+'</div>').join('')+'</div></details>';
}
document.addEventListener('change',e=>{if(e.target.matches('[data-feature]')&&document.querySelectorAll('[data-feature]:checked').length>6){e.target.checked=false;toast('最多可推荐 6 篇教程')}});
let dragging;
document.addEventListener('dragstart',e=>{dragging=e.target.closest('#featuredList .row');if(dragging)e.dataTransfer.setData('text/plain','featured')});
document.addEventListener('dragover',e=>{if(dragging&&e.target.closest('#featuredList'))e.preventDefault()});
document.addEventListener('drop',e=>{const row=e.target.closest('#featuredList .row');if(dragging&&row&&row!==dragging){e.preventDefault();const after=e.clientY>row.getBoundingClientRect().top+row.offsetHeight/2;row[after?'after':'before'](dragging)}dragging=null});
document.addEventListener('dragend',()=>dragging=null);
function settingsForm(){const s=state.settings, social=s.social||[],accounts=['wechat','douyin'].map(p=>social.find(x=>x.platform===p)||{platform:p});main().innerHTML=heading('网站设置')+'<form id="config"><div class="panel"><h2>基本信息</h2><div class="grid">'+field('网站名称','name',s.name)+field('网站标志地址','logo',s.logo)+field('首页标语','slogan',s.slogan,'text',true)+field('首页补充说明','description',s.description,'textarea',true)+field('网站介绍','about',s.about,'textarea',true)+'</div>'+btn('上传网站标志','pickLogo')+'</div><div class="panel"><h2>首页内容</h2><div class="grid">'+field('热门搜索（每行一个）','hot',(s.hot||[]).join('\n'),'textarea')+select('默认首页','homeLayout',s.homeLayout||'map',[['map','搜索导航首页'],['classic','原版首页']])+field('公告','announcement',s.announcement,'textarea')+'</div>'+featuredRows()+'</div><div class="panel"><h2>社交账号</h2>'+select('优先显示','first',social[0]?.platform||'wechat',[['wechat','微信公众号'],['douyin','抖音']])+accounts.map(a=>'<div class="block social" data-platform="'+a.platform+'"><h3>'+(a.platform==='wechat'?'微信公众号':'抖音')+'</h3><label><input type="checkbox" data-key="enabled" '+(a.enabled?'checked':'')+'> 启用此平台</label><div class="grid">'+field(a.platform==='wechat'?'公众号名称':'抖音昵称','name',a.name)+field(a.platform==='wechat'?'微信号':'抖音号','account',a.account)+field('二维码图片地址','qr',a.qr)+(a.platform==='douyin'?field('主页链接','url',a.url,'url'):'')+'</div>'+btn('上传二维码','pickQR')+'</div>').join('')+'</div><div class="panel"><h2>联系方式与页脚</h2><div class="grid">'+field('公开联系方式','contact',s.contact)+field('页脚文字','footer',s.footer)+'</div></div><div class="bar">'+btn('保存网站设置','settingsSave','','primary')+'<a href="/api/admin/export" download>导出完整备份（含图片和视频）</a></div></form>'}
function edit(a){editing={id:a?.id||'',content:structuredClone(a?.draft||a?.published||{title:'',summary:'',category:state.categories[0]?.id||'',tags:[],device:'通用',minutes:5,order:99,status:'新发布',blocks:[{type:'checklist',title:'开始前的准备',text:''},{type:'step',title:'',text:'',success:'',tip:''},{type:'success',title:'完成检查',text:''}],related:[]}),dirty:false};revision=0;editor()}
function blockForm(b,i){return '<div class="block contentBlock" data-type="'+esc(b.type)+'" data-index="'+i+'"><div class="bar"><b>'+esc(types[b.type]||b.type)+'</b><span class="spacer"></span>'+btn('上移','up')+btn('下移','down')+btn('移除','remove')+'</div>'+(['step','heading','faq','image','video','related'].includes(b.type)?field(b.type==='faq'?'问题':'标题','title',b.title):'')+(b.type!=='heading'?field(b.type==='checklist'?'清单（每行一项）':b.type==='faq'?'解答':'内容','text',b.text,'textarea'):'')+(['image','step'].includes(b.type)?field('图片地址','image',b.image)+btn('上传图片','blockImage')+btn('从图片库选择','library')+(b.image?'<img class="thumb" src="'+esc(b.image)+'" alt="已选图片">':''):'')+(['step','video'].includes(b.type)?'<div class="video-field">'+field('教学视频地址','video',b.video)+btn('上传教学视频','uploadVideo')+'<small> MP4 / WebM，最大 64 MB</small><p role="status"></p>'+(b.video?'<video controls playsinline preload="metadata" style="max-width:100%" src="'+esc(b.video)+'"></video>':'')+'</div>':'')+(b.type==='step'?field('完成后的正确状态','success',b.success)+field('常见问题与处理办法','tip',b.tip):'')+(b.type==='related'?field('链接地址','url',b.url):'')+'</div>'}
function coverForm(cover){
 const preview=cover?'<img class="thumb" alt="教程封面预览" src="'+esc(cover)+'">':'';
 return '<section class="panel" id="coverPicker"><h2>教程封面</h2><p class="muted">封面显示在教程列表。支持 JPG、PNG、WebP 和 GIF，最大 8 MB。</p><input type="hidden" data-key="cover" value="'+esc(cover||'')+'"><div class="actions">'+btn('上传封面','coverUpload')+btn('从图片库选择','library')+btn('恢复默认封面','coverReset')+'</div>'+preview+'</section>';
}
function editor(){const c=editing.content;main().innerHTML=heading(editing.id?'编辑教程':'新建教程',btn('返回列表','back'))+'<div id="editor"><div class="panel"><h2>教程信息</h2><div class="grid">'+field('教程标题','title',c.title,'text',true)+field('简介与完成目标','summary',c.summary,'textarea',true)+select('分类','category',c.category,state.categories.map(x=>[x.id,x.name]))+field('标签（用逗号分隔）','tags',(c.tags||[]).join('，'))+select('阅读版式','layout',c.layout||((c.blocks||[]).some(b=>b.type==='step')?'steps':'classic'),[['steps','分步操作'],['classic','原版图文']])+select('适用设备','device',c.device,['通用','电脑','手机'].map(x=>[x,x]))+field('预计用时（分钟）','minutes',c.minutes,'number')+field('推荐顺序（数字小的在前）','order',c.order,'number')+select('状态标记','status',c.status,['新发布','已更新','已失效',''].map(x=>[x,x||'无标记']))+field('最后核验日期','verifiedDate',c.verifiedDate,'date')+field('官方来源链接','sourceUrl',c.sourceUrl,'url')+field('更新说明','updateNote',c.updateNote,'text',true)+'</div></div>'+coverForm(c.cover)+'<div class="panel"><h2>图文内容</h2><div id="blocks">'+(c.blocks||[]).map(blockForm).join('')+'</div><div class="editor-tools">'+select('添加内容块','newType','step',Object.entries(types))+btn('添加内容块','addBlock')+'</div></div><div class="panel"><h2>相关教程</h2>'+articles().filter(a=>a.id!==editing.id).map(a=>'<label><input type="checkbox" data-related="'+esc(a.id)+'" '+(c.related?.includes(a.id)?'checked':'')+'> '+esc(title(a))+'</label>').join('')+'</div></div><div class="bar sticky"><span id="saved" class="muted">'+(editing.dirty?'正在编辑':'草稿自动保存')+'</span><span class="spacer"></span>'+btn('另存为模板','saveTemplate')+btn('历史版本','history')+btn('预览','preview')+btn('发布','publish','','primary')+'</div>';$('#editor').oninput=e=>{if(e.target.dataset.key!=='newType')changed()}}
function readContent(){if(!editing||!$('#editor'))return;const root=$('#editor'),c=editing.content;for(const k of ['title','summary','category','device','layout','status','updateNote','cover','sourceUrl','verifiedDate'])c[k]=val(k,root);c.minutes=Math.max(0,Number(val('minutes',root)));c.order=Number(val('order',root));c.tags=val('tags',root).split(/[,，、\n]/).map(t=>t.trim()).filter(Boolean);c.related=Array.from(root.querySelectorAll('[data-related]:checked'),el=>el.dataset.related);c.blocks=Array.from(root.querySelectorAll('.contentBlock'),el=>({...c.blocks[Number(el.dataset.index)],type:el.dataset.type,...Object.fromEntries(Array.from(el.querySelectorAll('[data-key]'),x=>[x.dataset.key,x.value]))}));root.querySelectorAll('.contentBlock').forEach((el,i)=>el.dataset.index=i)}
function changed(){editing.dirty=true;revision++;$('#saved').textContent='等待保存…';clearTimeout(timer);timer=setTimeout(()=>flush().catch(e=>toast(e.message)),850)}
function flush(){clearTimeout(timer);const target=editing;if(!target||!target.dirty)return saveChain;readContent();const content=structuredClone(target.content),v=revision;saveChain=saveChain.catch(()=>{}).then(async()=>{const r=await api('admin/article',{id:target.id||undefined,content,action:'save'});target.id=r.id;if(editing===target&&revision===v){target.dirty=false;if($('#saved'))$('#saved').textContent='草稿已保存'}}).catch(e=>{if($('#saved'))$('#saved').textContent='保存失败，请重试';throw e});return saveChain}
function showPreview(){readContent();const c=editing.content;popup('草稿预览','<article><h1>'+esc(c.title||'未命名教程')+'</h1><p>'+esc(c.summary)+'</p><small>'+esc(c.device)+' · '+esc(c.minutes)+' 分钟 · '+esc(category(c.category))+'</small>'+c.blocks.map(b=>'<section class="'+(['note','checklist'].includes(b.type)?'note':'')+'"><h3>'+esc(b.title||types[b.type])+'</h3><p style="white-space:pre-line">'+esc(b.text)+'</p>'+(b.image?'<img src="'+esc(b.image)+'" alt="'+esc(b.title||'教程截图')+'">':'')+(b.success?'<p>完成状态 · '+esc(b.success)+'</p>':'')+(b.tip?'<p class="note">'+esc(b.tip)+'</p>':'')+(b.url?'<p>'+esc(b.url)+'</p>':'')+'</section>').join('')+'</article>')}
function chooseFile(){return new Promise(resolve=>{const input=document.createElement('input');input.type='file';input.accept='image/png,image/jpeg,image/webp,image/gif';input.onchange=()=>resolve(input.files[0]);input.oncancel=()=>resolve(null);input.click()})}
async function upload(){const f=await chooseFile();if(!f)return;if(f.size>8*1024*1024)throw new Error('请选择 8 MB 以内的图片');const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(new Error('无法读取图片'));r.readAsDataURL(f)});const item=await api('admin/media',{name:f.name,data});state.media.push(item);return item}
let libraryBlock;
async function movePage(p){await flush();editing=null;section=p;await refresh();frame()}
function setPic(el,src){el.querySelector('[data-key="image"],[data-key="cover"]').value=src;let img=el.querySelector('.thumb');if(!src){img?.remove();changed();return}if(!img){img=document.createElement('img');img.className='thumb';img.alt='已选图片';el.append(img)}img.src=src;changed()}
async function act(b){const a=b.dataset.action,id=b.dataset.id;
if(a==='importHTML'){
  popup('一键导入 HTML','<p>选择一个 HTML 文件即可生成可编辑的草稿。网页引用本地配图时，请把 HTML 和图片文件夹一起打包为 ZIP。网页中的脚本与交互组件会略过。</p><label>教程文件<input id="importFile" type="file" accept=".html,.htm,.zip"></label><p id="importState" role="status"></p>');
  $('#importFile').onchange=async event=>{
    const input=event.target,file=input.files[0];if(!file)return;
    const message=$('#importState'),close=$('#modal .bar button');
    input.disabled=true;close.disabled=true;
    const preventClose=e=>e.preventDefault();
    $('#modal').addEventListener('cancel',preventClose);
    try{
      message.textContent='正在读取教程…';
      const {importTutorial}=await import('/tutorial-import.js');
      const {content,warnings}=await importTutorial(file,state.categories,body=>api('admin/media',body),msg=>message.textContent=msg);
      const draft=await api('admin/article',{content,action:'save'});
      $('#modal').close();edit({id:draft.id,draft:content});toast('已导入为草稿，可以预览并发布');
      if(warnings.length)popup('草稿已导入，部分配图需补充','<p>请在编辑器中补上以下图片，再预览发布。</p><ul>'+warnings.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>');
    }catch(err){message.textContent='导入失败：'+err.message;input.disabled=false;input.value='';}
    finally{close.disabled=false;$('#modal').removeEventListener('cancel',preventClose);}
  };return;
}
if(a==='nav'||a==='back')return movePage(a==='back'?'教程管理':id);
if(a==='logout'){await flush();await api('logout',{});editing=null;login();return}
if(a==='filter'){filter=id;draw();return}
if(a==='new'||a==='templates'){
 const presets=[['video','视频教程','在操作步骤中上传录屏并添加说明','video-template.html'],['steps','分步操作','每次显示一步，带目录、进度和完成检查','steps-template.html'],['classic','原版图文','连续阅读整篇教程，可按目录跳转','tutorial-template.html']];
 popup('教程模板库',presets.map(([key,name,desc,file])=>'<div class="block"><h3>'+name+'</h3><p>'+desc+'</p><div class="actions">'+btn('使用模板','useTemplate',key)+' <a target="_blank" href="/'+file+'">查看示例</a> <a href="/'+file+'" download>下载 HTML</a></div></div>').join('')+(state.templates||[]).map(t=>'<div class="row"><b>'+esc(t.name)+'</b>'+btn('使用模板','useTemplate',t.id)+'</div>').join('')+'<p>要添加模板，先在编辑器排好步骤和配图，再点击“另存为模板”。</p>');
 return}
if(a==='useTemplate'){
 $('#modal').close();section='教程管理';frame();const source=state.templates?.find(t=>t.id===id);edit(source?{draft:source.content}:null);
 if(!source)editing.content.layout=id==='video'?'steps':id;if(id==='video')editing.content.blocks=[{type:'step',title:'观看操作演示',text:'',video:''},{type:'success',title:'完成检查',text:''}];editor();changed();return}
if(a==='saveTemplate'){readContent();popup('添加教程模板',field('模板名称','templateName',editing.content.title||'')+btn('保存模板','confirmTemplate','','primary'));return}
if(a==='confirmTemplate'){const name=val('templateName',$('#mc')).trim();if(!name)throw Error('请填写模板名称');
 const template=await api('admin/template',{name,content:editing.content});(state.templates??=[]).push(template);$('#modal').close();toast('模板已添加到模板库');return}
if(a==='edit'){section='教程管理';frame();edit(a==='edit'?article(id):null);return}
if(['trash','archive','restore'].includes(a)){if(a!=='restore'&&!confirm(a==='trash'?'将这篇教程移入回收站？':'归档后访客将看到归档说明，继续吗？'))return;await api('admin/article',{id,action:a});await refresh();draw();toast('教程状态已更新');return}
if(a==='categoryAdd'){$('#categories').insertAdjacentHTML('beforeend',categoryRow({id:crypto.randomUUID(),name:'',order:$('.cat:last-child')?Number(val('order',$('.cat:last-child')))+1:0}));return}
if(a==='categorySave'){const categories=Array.from(document.querySelectorAll('.cat'),el=>({id:el.dataset.id,name:val('name',el).trim(),hidden:el.querySelector('[data-key="hidden"]').checked,order:Number(val('order',el))}));if(categories.some(c=>!c.name))throw new Error('请填写每个分类的名称');await api('admin/config',{categories});await refresh();draw();toast('分类已保存');return}
if(a==='routeAdd'){$('#routeRows').insertAdjacentHTML('beforeend',routeRow({}));return}
if(a==='routeSave'){const route=Array.from(document.querySelectorAll('.route'),el=>Object.fromEntries(['title','description','articleId'].map(k=>[k,val(k,el)])));if(route.some(r=>!r.title.trim()))throw new Error('请填写每个环节的名称');await api('admin/config',{route});await refresh();draw();toast('学习路线已保存');return}
if(a==='up'||a==='down'||a==='remove'){const el=b.closest('.block'),inEditor=el.classList.contains('contentBlock');if(a==='remove')el.remove();else if(a==='up'&&el.previousElementSibling)el.parentElement.insertBefore(el,el.previousElementSibling);else if(a==='down'&&el.nextElementSibling)el.nextElementSibling.after(el);if(inEditor)changed();return}
if(a==='upload'){if(await upload()){draw();toast('图片已上传')}return}
if(a==='copy'){await navigator.clipboard.writeText(new URL(id,location.origin).href);toast('图片地址已复制');return}
if(a==='pickLogo'||a==='pickQR'){const item=await upload();if(item)(a==='pickLogo'?$('#config [data-key="logo"]'):b.closest('.social').querySelector('[data-key="qr"]')).value=item.url;return}
if(a==='featureUp'||a==='featureDown'){const row=b.closest('.row');if(a==='featureUp')row.previousElementSibling?.before(row);else row.nextElementSibling?.after(row);return}
if(a==='settingsSave'){const form=$('#config');if(!form.reportValidity())return;const settings={...state.settings,featured:[...form.querySelectorAll('[data-feature]:checked')].map(el=>el.dataset.feature)};for(const k of ['name','logo','slogan','description','about','announcement','contact','footer','homeLayout'])settings[k]=val(k,form).trim();if(!settings.name)throw new Error('请填写网站名称');settings.hot=val('hot',form).split(/\n/).map(v=>v.trim()).filter(Boolean);settings.social=Array.from(form.querySelectorAll('.social'),el=>({platform:el.dataset.platform,...Object.fromEntries(['name','account','qr','url'].map(k=>[k,val(k,el).trim()])),enabled:el.querySelector('[data-key="enabled"]').checked})).sort((x,y)=>Number(y.platform===val('first',form))-Number(x.platform===val('first',form)));await api('admin/config',{settings});await refresh();draw();toast('网站设置已更新');return}
if(a==='addBlock'){readContent();const type=val('newType');editing.content.blocks.push({id:crypto.randomUUID(),type,title:'',text:''});editor();changed();Array.from(document.querySelectorAll('.contentBlock')).at(-1)?.querySelector('input,textarea')?.focus();return}
if(a==='uploadVideo'){
 const area=b.closest('.video-field'),input=document.createElement('input');input.type='file';input.accept='video/mp4,video/webm,.mp4,.webm';
 const file=await new Promise(r=>{input.onchange=()=>r(input.files[0]);input.oncancel=()=>r(null);input.click()});if(!file)return;
 if(file.size>64*1024*1024)throw Error('请选择 64 MB 以内的视频');
 const status=area.querySelector('[role=status]'),mime=file.name.toLowerCase().endsWith('.webm')?'video/webm':'video/mp4';
 status.textContent='正在上传…';
 try{
 const item=await new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST','/api/admin/video?name='+encodeURIComponent(file.name));xhr.setRequestHeader('Content-Type',mime);xhr.responseType='json';
 xhr.upload.onprogress=e=>{if(e.lengthComputable)status.textContent='已上传 '+Math.round(e.loaded/e.total*100)+'%'};
 xhr.onerror=()=>reject(Error('网络中断，请重新上传'));xhr.onload=()=>xhr.status===200?resolve(xhr.response):reject(Error(xhr.response?.error||'视频上传失败'));xhr.send(file)});
 if(!area.isConnected)return;area.querySelector('[data-key=video]').value=item.url;
 const player=area.querySelector('video')||document.createElement('video');player.controls=true;player.playsInline=true;player.preload='metadata';player.style.maxWidth='100%';player.src=item.url;area.append(player);
 status.textContent='上传成功，可播放预览';changed();
 }catch(error){status.textContent=error.message;throw error}return}
if(a==='coverUpload'){const target=b.closest('#coverPicker');const item=await upload();if(item&&target.isConnected)setPic(target,item.url);return}
if(a==='coverReset'){setPic(b.closest('#coverPicker'),'');return}
if(a==='blockImage'){const item=await upload();if(item)setPic(b.closest('.contentBlock'),item.url);return}
if(a==='library'){libraryBlock=b.closest('.contentBlock,#coverPicker');popup('选择图片','<div class="gallery">'+(state.media.filter(i=>!i.mime?.startsWith('video/')).map(i=>'<button data-action="useImage" data-id="'+esc(i.url)+'"><img src="'+esc(i.url)+'" alt="'+esc(i.name)+'">'+esc(i.name)+'</button>').join('')||empty('图片库为空，请先上传图片。'))+'</div>');return}
if(a==='useImage'){setPic(libraryBlock,id);$('#modal').close();return}
if(a==='preview'){if(!editing.id)changed();await flush();popup('草稿预览','<iframe title="教程预览" style="width:100%;height:65vh;border:0" src="/?article='+encodeURIComponent(editing.id)+'&amp;preview=1"></iframe>');return}
if(a==='publish'){readContent();if(!editing.content.title.trim())throw new Error('请先填写教程标题');await flush();const target=editing;await api('admin/article',{id:target.id||undefined,content:target.content,action:'publish'});editing=null;await refresh();section='教程管理';frame();toast('教程已发布');return}
if(a==='history'){await flush();await refresh();const hist=article(editing.id)?.history||[];popup('历史版本',hist.length?hist.map((h,i)=>'<div class="row"><div><b>'+esc(h.content.title)+'</b><p class="muted">'+esc(h.at)+'</p></div>'+btn('恢复为草稿','revert',i)+'</div>').join(''):empty('发布并更新教程后，可以在这里恢复历史版本。'));return}
if(a==='revert'){if(!confirm('将这个版本恢复为当前草稿？'))return;editing.content=structuredClone(article(editing.id).history[Number(id)].content);$('#modal').close();editor();changed();await flush();toast('历史版本已恢复为草稿');return}
}
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;b.disabled=true;try{await act(b)}catch(err){toast(err.message);if(err.status===401)login()}finally{b.disabled=false}});
window.addEventListener('beforeunload',e=>{if(editing?.dirty){e.preventDefault();e.returnValue=''}});
start();
</script></body></html>
