<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-label="选择解压位置"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#27364c}.small{font-size:15px}.big{font-size:20px;font-weight:600}.muted{fill:#5f7189}.accent{fill:#235aca}</style><rect width="880" height="370" rx="14" fill="#eaf0f8"/><text x="34" y="39" font-size="19" font-weight="700">操作示意 · 选择解压位置</text><rect x="35" y="57" width="810" height="237" rx="9" fill="#fff" stroke="#bbcadc"/><path d="M36 96h808" stroke="#c5d2e2"/><circle cx="55" cy="77" r="4" fill="#b0c2d7"/><circle cx="69" cy="77" r="4" fill="#b0c2d7"/><circle cx="83" cy="77" r="4" fill="#b0c2d7"/><text x="111" y="83" class="small">提取压缩文件夹</text><text x="85" y="141" class="big">将文件提取到这个文件夹</text><rect x="84" y="159" width="586" height="42" rx="6" fill="#f6f9fd" stroke="#a9bdd7"/><text x="100" y="187" class="small">桌面　›　练习资料</text><rect x="690" y="159" width="108" height="42" rx="6" fill="#edf3fa" stroke="none"/><text x="719" y="187" class="small">浏览…</text><text x="85" y="239" class="small">☑　完成时显示提取的文件</text><rect x="690" y="228" width="108" height="40" rx="6" fill="#275ddb" stroke="none"/><text x="725" y="254" style="fill:white;font-size:16px">提取</text><text x="35" y="334" class="small muted">记下目标文件夹。在解压完成后，你可以从这个位置打开文件。</text></svg>